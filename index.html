<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服务导航 - znwd</title>
    <style>
        /* ===== 原有样式 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            padding: 30px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 42px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: #a0aec0;
            font-size: 16px;
            margin-top: 8px;
            -webkit-text-fill-color: #a0aec0;
        }

        .header .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 16px;
            font-size: 14px;
            color: #718096;
            flex-wrap: wrap;
        }

        .header .stats span {
            background: rgba(255, 255, 255, 0.06);
            padding: 4px 16px;
            border-radius: 20px;
        }

        .header .stats .online-count {
            color: #48bb78;
        }
        .header .stats .offline-count {
            color: #fc8181;
        }

        /* ===== 操作按钮栏 ===== */
        .action-bar {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .action-bar .btn {
            padding: 8px 24px;
            border-radius: 20px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .action-bar .btn:hover {
            transform: translateY(-2px);
        }

        /* 刷新按钮 - 与原来一致 */
        .action-bar .btn-refresh {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
        }

        .action-bar .btn-refresh:hover {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 24px rgba(255, 255, 255, 0.1);
        }

        .action-bar .btn-refresh:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* 反馈按钮 - 和刷新按钮一样大 */
        .action-bar .btn-feedback {
            background: rgba(251, 191, 36, 0.15);
            border: 1px solid rgba(251, 191, 36, 0.3);
            color: #fbbf24;
        }

        .action-bar .btn-feedback:hover {
            background: rgba(251, 191, 36, 0.25);
            box-shadow: 0 8px 24px rgba(251, 191, 36, 0.15);
        }

        .section-title {
            color: #e2e8f0;
            font-size: 20px;
            font-weight: 600;
            margin: 30px 0 16px 0;
            padding-left: 4px;
            border-left: 4px solid #667eea;
            padding-left: 12px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 18px;
        }

        .card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 24px 20px;
            text-decoration: none;
            color: #e2e8f0;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
        }

        .card.clickable {
            cursor: pointer;
        }

        .card.clickable:hover {
            transform: translateY(-6px);
            border-color: #667eea;
            background: rgba(255, 255, 255, 0.13);
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.5);
        }

        .card.disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .card.disabled:hover {
            transform: none;
            border-color: rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.07);
            box-shadow: none;
        }

        .card .icon {
            font-size: 40px;
            margin-bottom: 10px;
        }
        .card .name {
            font-weight: 600;
            font-size: 17px;
        }
        .card .desc {
            font-size: 13px;
            color: #a0aec0;
            margin-top: 4px;
        }
        .card .port {
            font-size: 12px;
            background: rgba(102, 126, 234, 0.2);
            padding: 3px 14px;
            border-radius: 20px;
            margin-top: 10px;
            color: #a0aec0;
            font-family: monospace;
        }
        .card .status-badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 11px;
            margin-top: 8px;
            font-weight: 500;
        }
        .status-badge.online {
            background: rgba(72, 187, 120, 0.2);
            color: #48bb78;
        }
        .status-badge.offline {
            background: rgba(252, 129, 129, 0.2);
            color: #fc8181;
        }
        .status-badge.checking {
            background: rgba(255, 255, 255, 0.1);
            color: #a0aec0;
        }

        .card.disabled .lock-icon {
            position: absolute;
            top: 8px;
            right: 12px;
            font-size: 14px;
            color: #718096;
        }

        .docker-badge {
            display: inline-block;
            font-size: 10px;
            background: rgba(0, 0, 0, 0.3);
            padding: 1px 10px;
            border-radius: 12px;
            color: #718096;
            margin-top: 6px;
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .checking .status-badge.checking {
            animation: pulse 1.5s ease-in-out infinite;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 28px;
            }
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            }
            .card {
                padding: 16px;
            }
            .card .icon {
                font-size: 30px;
            }
            .action-bar .btn {
                padding: 6px 16px;
                font-size: 12px;
            }
        }

        /* ===== 模态框样式（贴吧） ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: linear-gradient(135deg, #1a1a3e, #2d2b55);
            border-radius: 20px;
            padding: 30px;
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.8);
            position: relative;
        }

        .modal::-webkit-scrollbar {
            width: 6px;
        }
        .modal::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        .modal::-webkit-scrollbar-thumb {
            background: rgba(102, 126, 234, 0.4);
            border-radius: 10px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .modal-header .modal-title {
            font-size: 24px;
            font-weight: 700;
            color: #e2e8f0;
        }

        .modal-header .modal-title span {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .modal-close {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #a0aec0;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            transform: rotate(90deg);
        }

        /* ===== 贴吧样式（嵌入模态框） ===== */
        .post-area {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .post-area .post-header {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .post-area .post-header input,
        .post-area .post-header select {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            flex: 1;
            min-width: 100px;
        }

        .post-area .post-header select option {
            background: #2d2b55;
        }

        .post-area textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #e2e8f0;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            resize: vertical;
            min-height: 60px;
            font-family: inherit;
        }

        .post-area textarea::placeholder {
            color: #718096;
        }

        .post-area .post-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .post-area .post-actions .tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .post-area .post-actions .tags button {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #a0aec0;
            padding: 3px 12px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.3s ease;
        }

        .post-area .post-actions .tags button:hover,
        .post-area .post-actions .tags button.active {
            background: rgba(102, 126, 234, 0.2);
            border-color: #667eea;
            color: #e2e8f0;
        }

        .btn-submit {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            color: white;
            padding: 6px 22px;
            border-radius: 18px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-submit:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.4);
        }

        .sort-controls {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        .sort-controls .sort-label {
            font-size: 12px;
            color: #a0aec0;
        }

        .sort-controls button {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #a0aec0;
            padding: 3px 14px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.3s ease;
        }

        .sort-controls button:hover,
        .sort-controls button.active {
            background: rgba(102, 126, 234, 0.2);
            border-color: #667eea;
            color: #e2e8f0;
        }

        .post-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .post-list::-webkit-scrollbar {
            width: 4px;
        }
        .post-list::-webkit-scrollbar-thumb {
            background: rgba(102, 126, 234, 0.3);
            border-radius: 10px;
        }

        .post-item {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 14px 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        .post-item:hover {
            border-color: rgba(102, 126, 234, 0.2);
        }

        .post-item .post-meta {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .post-item .post-meta .author {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .post-item .post-meta .author .avatar-sm {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: white;
        }

        .post-item .post-meta .author .name {
            font-weight: 600;
            font-size: 13px;
        }

        .post-item .post-meta .author .tag {
            font-size: 10px;
            padding: 1px 10px;
            border-radius: 10px;
            background: rgba(102, 126, 234, 0.2);
            color: #a0aec0;
        }

        .post-item .post-meta .time {
            font-size: 11px;
            color: #718096;
        }

        .post-item .post-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
            color: #e2e8f0;
        }

        .post-item .post-content {
            font-size: 13px;
            color: #cbd5e0;
            line-height: 1.5;
            margin-bottom: 8px;
            word-break: break-word;
        }

        .post-item .post-stats {
            display: flex;
            gap: 16px;
            font-size: 12px;
            color: #718096;
        }

        .post-item .post-stats span {
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .post-item .post-stats span:hover {
            color: #667eea;
        }

        .post-item .post-stats .liked {
            color: #fc8181;
        }

        .comment-section {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .comment-section .comment-input {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        .comment-section .comment-input input {
            flex: 1;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #e2e8f0;
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 12px;
        }

        .comment-section .comment-input input::placeholder {
            color: #718096;
        }

        .comment-section .comment-input button {
            background: rgba(102, 126, 234, 0.3);
            border: none;
            color: white;
            padding: 4px 16px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .comment-section .comment-input button:hover {
            background: rgba(102, 126, 234, 0.5);
        }

        .comment-item {
            display: flex;
            gap: 8px;
            padding: 4px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .comment-item:last-child {
            border-bottom: none;
        }

        .comment-item .avatar-xs {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            color: white;
            flex-shrink: 0;
        }

        .comment-item .comment-body {
            flex: 1;
        }

        .comment-item .comment-body .cname {
            font-size: 11px;
            font-weight: 600;
            color: #a0aec0;
        }

        .comment-item .comment-body .ctext {
            font-size: 12px;
            color: #cbd5e0;
        }

        .comment-item .comment-body .ctime {
            font-size: 10px;
            color: #718096;
        }

        .comment-item .comment-actions {
            font-size: 11px;
            color: #718096;
            cursor: pointer;
        }

        .comment-item .comment-actions:hover {
            color: #fc8181;
        }

        .empty-state {
            text-align: center;
            padding: 30px 20px;
            color: #718096;
        }

        .empty-state .big-icon {
            font-size: 36px;
            margin-bottom: 8px;
        }
        .empty-state .sub {
            font-size: 12px;
            color: #4a5568;
        }

        .modal-footer {
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
            color: #4a5568;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 服务导航</h1>
            <p>快速访问您的本地 Docker 服务</p>
            <div class="stats">
                <span>📦 <span id="totalServices">0</span> 个服务</span>
                <span class="online-count">🟢 <span id="onlineCount">0</span> 个运行中</span>
                <span class="offline-count">🔴 <span id="offlineCount">0</span> 个未运行</span>
                <span>⏱️ <span id="lastUpdate">--</span></span>
            </div>
            <div class="action-bar">
                <button class="btn btn-refresh" onclick="checkAllServices()">🔄 刷新状态</button>
                <button class="btn btn-feedback" onclick="openForum()">💬 意见反馈</button>
            </div>
        </div>

        <!-- 服务列表 -->
        <div id="serviceGroups"></div>

        <div style="text-align:center;margin-top:50px;color:#4a5568;font-size:13px;border-top:1px solid rgba(255,255,255,0.06);padding-top:24px;">
            🖥️ znwd-server · 所有服务均运行在本地 Docker 中<br>
            提示：请确保对应容器已启动，端口未被占用
        </div>
    </div>

    <!-- ===== 贴吧模态框 ===== -->
    <div class="modal-overlay" id="forumModal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">💬 <span>意见反馈 · 社区</span></div>
                <button class="modal-close" onclick="closeForum()">✕</button>
            </div>

            <!-- 发帖区 -->
            <div class="post-area">
                <div class="post-header">
                    <input type="text" id="postTitle" placeholder="📌 标题..." maxlength="80">
                    <select id="postCategory">
                        <option value="💬 讨论">💬 讨论</option>
                        <option value="❓ 提问">❓ 提问</option>
                        <option value="💡 建议">💡 建议</option>
                        <option value="🐛 Bug反馈">🐛 Bug反馈</option>
                        <option value="📢 公告">📢 公告</option>
                    </select>
                </div>
                <textarea id="postContent" placeholder="📝 写下你的反馈或建议..."></textarea>
                <div class="post-actions">
                    <div class="tags" id="filterTags">
                        <button data-tag="全部" class="active" onclick="filterPosts('全部')">🏷️ 全部</button>
                        <button data-tag="💬 讨论" onclick="filterPosts('💬 讨论')">💬</button>
                        <button data-tag="❓ 提问" onclick="filterPosts('❓ 提问')">❓</button>
                        <button data-tag="💡 建议" onclick="filterPosts('💡 建议')">💡</button>
                        <button data-tag="🐛 Bug反馈" onclick="filterPosts('🐛 Bug反馈')">🐛</button>
                    </div>
                    <button class="btn-submit" onclick="submitPost()">🚀 发布</button>
                </div>
            </div>

            <!-- 排序 -->
            <div class="sort-controls">
                <span class="sort-label">📊 排序：</span>
                <button class="active" onclick="setSort('newest')">最新</button>
                <button onclick="setSort('oldest')">最早</button>
                <button onclick="setSort('mostLiked')">最热</button>
                <button onclick="setSort('mostCommented')">最多评论</button>
                <span style="flex:1;"></span>
                <span style="font-size:11px;color:#718096;" id="filterLabel">🏷️ 全部</span>
            </div>

            <!-- 帖子列表 -->
            <div class="post-list" id="postList"></div>

            <div class="modal-footer">
                💡 所有数据存储在浏览器本地 · 欢迎提出宝贵意见
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        //  服务导航逻辑（原有）
        // ============================================================

        const services = {
            '📋 项目开发': [
                { id: 'qasystem', icon: '📋', name: '硕日售前技术支持系统', desc: '售前技术支持 / 方案管理', url: 'http://10.10.100.75:8100',
                    port: '8100', badge: 'qasystem-test:latest', container: 'qasystem', clickable: true },
                { id: 'taskmanage', icon: '📅', name: '月度任务管理系统', desc: '月度任务规划与跟踪', url: 'http://10.10.100.75:8300',
                    port: '8300', badge: 'taskmanage0907', container: 'taskmanage0907', clickable: true }
            ],
            '📊 监控 & 可视化': [
                { id: 'grafana', icon: '📈', name: 'Grafana', desc: '监控仪表盘 / 数据可视化', url: 'http://10.10.100.75:3000',
                    port: '3000', badge: 'grafana/grafana:latest', container: 'grafana', clickable: true }
            ]
        };

        let serviceStatus = {};

        function checkServiceReliable(id, url) {
            return new Promise((resolve) => {
                let isResolved = false;
                
                // 解析URL
                let baseUrl = url;
                if (url.endsWith('/')) {
                    baseUrl = url.slice(0, -1);
                }
                
                // 检测路径列表
                const paths = [
                    '',
                    '/',
                    '/favicon.ico',
                    '/robots.txt',
                    '/health',
                    '/ping',
                    '/status',
                    '/api/health'
                ];
                
                let currentIndex = 0;
                
                function tryNextPath() {
                    if (currentIndex >= paths.length || isResolved) {
                        return;
                    }
                    
                    const path = paths[currentIndex];
                    const testUrl = baseUrl + path;
                    currentIndex++;
                    
                    // 使用 fetch 检测
                    fetch(testUrl, {
                        method: 'HEAD',
                        mode: 'no-cors',
                        cache: 'no-cache',
                        signal: AbortSignal.timeout(2000)
                    })
                    .then(() => {
                        if (!isResolved) {
                            isResolved = true;
                            resolve({ id, status: 'online' });
                        }
                    })
                    .catch(() => {
                        // 如果失败，尝试 image 检测
                        if (!isResolved && path !== '') {
                            const img = new Image();
                            const timeout = setTimeout(() => {
                                img.src = '';
                                if (!isResolved) {
                                    tryNextPath();
                                }
                            }, 2000);
                            
                            img.onload = () => {
                                clearTimeout(timeout);
                                if (!isResolved) {
                                    isResolved = true;
                                    resolve({ id, status: 'online' });
                                }
                            };
                            img.onerror = () => {
                                clearTimeout(timeout);
                                if (!isResolved) {
                                    tryNextPath();
                                }
                            };
                            img.src = testUrl + '?_=' + Date.now();
                        } else {
                            if (!isResolved) {
                                tryNextPath();
                            }
                        }
                    });
                }
                
                // 开始检测
                tryNextPath();
                
                // 总超时
                setTimeout(() => {
                    if (!isResolved) {
                        isResolved = true;
                        // 最后尝试：直接检测端口
                        const port = new URL(url).port || 80;
                        resolve({ id, status: port === 80 || port === 443 ? 'online' : 'offline' });
                    }
                }, 8000);
            });
        }

        async function checkAllServices() {
            renderServices();
            updateStats();

            try {
                const response = await fetch('service-status.json?t=' + Date.now(), { cache: 'no-store' });
                const data = await response.json();
                
                for (const group in services) {
                    for (const svc of services[group]) {
                        const containerStatus = data.containers[svc.container];
                        serviceStatus[svc.id] = containerStatus === 'online' ? 'online' : 'offline';
                    }
                }
            } catch (error) {
                console.warn('状态文件不可用，改用浏览器直接检测服务:', error);
                const checks = Object.values(services).flat().map(async svc => {
                    const result = await checkServiceReliable(svc.id, svc.url);
                    serviceStatus[result.id] = result.status;
                });
                await Promise.allSettled(checks);
            }

            renderServices();
            updateStats();
            document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
        }

        function renderServices() {
            const container = document.getElementById('serviceGroups');
            let html = '';
            for (const [groupName, servicesList] of Object.entries(services)) {
                html += `<div class="section-title">${groupName}</div><div class="grid">`;
                for (const svc of servicesList) {
                    const status = serviceStatus[svc.id] || 'unknown';
                    const statusText = { 'online': '✅ 运行中', 'offline': '❌ 未运行', 'unknown': '⏳ 检测中...' } [status];
                    const statusClass = { 'online': 'online', 'offline': 'offline', 'unknown': 'checking' } [status];
                    const isClickable = svc.clickable === true;
                    const cardClass = isClickable ? 'card clickable' : 'card disabled';
                    const hrefAttr = isClickable ? `href="${svc.url}"` : 'href="javascript:void(0)"';
                    const targetAttr = isClickable ? 'target="_blank"' : '';
                    const lockIcon = isClickable ? '' : `<span class="lock-icon">🔒</span>`;
                    html += `
                        <a ${hrefAttr} ${targetAttr} class="${cardClass}">
                            ${lockIcon}
                            <div class="icon">${svc.icon}</div>
                            <div class="name">${svc.name}</div>
                            <div class="desc">${svc.desc}</div>
                            <div class="port">${svc.port}</div>
                            <div class="status-badge ${statusClass}">${statusText}</div>
                            <div class="docker-badge">${svc.badge}</div>
                        </a>
                    `;
                }
                html += `</div>`;
            }
            container.innerHTML = html;
        }

        function updateStats() {
            let online = 0,
                offline = 0,
                total = 0;
            for (const group in services) {
                for (const svc of services[group]) {
                    total++;
                    const status = serviceStatus[svc.id] || 'unknown';
                    if (status === 'online') online++;
                    else if (status === 'offline') offline++;
                }
            }
            document.getElementById('totalServices').textContent = total;
            document.getElementById('onlineCount').textContent = online;
            document.getElementById('offlineCount').textContent = offline;
        }

        // ============================================================
        //  贴吧逻辑 - 服务器存储版本
        // ============================================================

        // ----- 配置 -----
        // LAN 部署时请求当前主机；如后端走独立端口或反向代理，可在页面加载前设置 FORUM_API_BASE。
        const API_BASE = window.FORUM_API_BASE ||
            `${location.protocol}//${location.hostname || 'localhost'}:3001/api`;

        // ----- 数据层（调用服务器API）-----
        let cachedPosts = [];
        let currentUser = getProfile();

        function getProfile() {
            try {
                return JSON.parse(localStorage.getItem('forum_profile')) || { 
                    name: '游客', 
                    avatar: '👤' 
                };
            } catch { 
                return { name: '游客', avatar: '👤' }; 
            }
        }

        function saveProfile(profile) {
            localStorage.setItem('forum_profile', JSON.stringify(profile));
            currentUser = profile;
        }

        // 从服务器获取帖子
        async function fetchPosts() {
            try {
                const response = await fetch(`${API_BASE}/posts`);
                const result = await response.json();
                if (result.success) {
                    cachedPosts = result.data;
                    return cachedPosts;
                }
                return [];
            } catch (err) {
                console.error('获取帖子失败:', err);
                return [];
            }
        }

        // 发布帖子到服务器
        async function submitPostToServer(title, content, category, author, avatar) {
            try {
                const response = await fetch(`${API_BASE}/posts`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, content, category, author, avatar })
                });
                const result = await response.json();
                return result;
            } catch (err) {
                console.error('发布失败:', err);
                return { success: false, message: '网络错误' };
            }
        }

        // 删除帖子
        async function deletePostFromServer(postId) {
            try {
                const response = await fetch(`${API_BASE}/posts/${postId}`, {
                    method: 'DELETE'
                });
                const result = await response.json();
                return result;
            } catch (err) {
                console.error('删除失败:', err);
                return { success: false, message: '网络错误' };
            }
        }

        // 点赞/取消点赞
        async function toggleLikeOnServer(postId, username) {
            try {
                const response = await fetch(`${API_BASE}/posts/${postId}/like`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username })
                });
                const result = await response.json();
                return result;
            } catch (err) {
                console.error('操作失败:', err);
                return { success: false, message: '网络错误' };
            }
        }

        // 添加评论
        async function addCommentToServer(postId, text, author, avatar) {
            try {
                const response = await fetch(`${API_BASE}/posts/${postId}/comments`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, author, avatar })
                });
                const result = await response.json();
                return result;
            } catch (err) {
                console.error('评论失败:', err);
                return { success: false, message: '网络错误' };
            }
        }

        // 删除评论
        async function deleteCommentFromServer(postId, commentId) {
            try {
                const response = await fetch(`${API_BASE}/posts/${postId}/comments/${commentId}`, {
                    method: 'DELETE'
                });
                const result = await response.json();
                return result;
            } catch (err) {
                console.error('删除评论失败:', err);
                return { success: false, message: '网络错误' };
            }
        }

        // ----- 页面交互函数（异步版本）-----
        let currentSort = 'newest';
        let currentFilter = '全部';

        // 打开论坛
        async function openForum() {
            document.getElementById('forumModal').classList.add('show');
            
            // 检查用户
            const profile = getProfile();
            if (profile.name === '游客') {
                const name = prompt('👋 欢迎来到反馈社区！请设置你的昵称（用于发帖和评论）：', 
                    '用户' + Math.floor(Math.random() * 1000));
                if (name && name.trim()) {
                    saveProfile({ name: name.trim(), avatar: '👤' });
                }
            }
            
            // 加载数据
            await refreshPosts();
            updateUserDisplay();
        }

        function closeForum() {
            document.getElementById('forumModal').classList.remove('show');
        }

        function updateUserDisplay() {
            const profile = getProfile();
            document.querySelector('.modal-header .modal-title').innerHTML =
                `💬 <span>意见反馈 · 社区</span> <span style="font-size:12px;color:#a0aec0;font-weight:400;">👤 ${profile.name}</span>`;
        }

        // 刷新帖子列表
        async function refreshPosts() {
            await fetchPosts();
            renderPosts();
        }

        // 发布帖子
        async function submitPost() {
            const title = document.getElementById('postTitle').value.trim();
            const content = document.getElementById('postContent').value.trim();
            const category = document.getElementById('postCategory').value;
            const profile = getProfile();

            if (!title) { alert('请填写标题'); return; }
            if (!content) { alert('请填写内容'); return; }

            const result = await submitPostToServer(title, content, category, profile.name, profile.avatar);
            
            if (result.success) {
                document.getElementById('postTitle').value = '';
                document.getElementById('postContent').value = '';
                await refreshPosts();
                alert('✅ 发布成功！');
            } else {
                alert('❌ 发布失败：' + (result.message || '未知错误'));
            }
        }

        // 删除帖子
        async function deletePost(postId) {
            if (!confirm('确定删除这个帖子吗？')) return;
            const result = await deletePostFromServer(postId);
            if (result.success) {
                await refreshPosts();
            } else {
                alert('删除失败：' + (result.message || '未知错误'));
            }
        }

        // 点赞
        async function toggleLike(postId) {
            const profile = getProfile();
            const result = await toggleLikeOnServer(postId, profile.name);
            if (result.success) {
                await refreshPosts();
            } else {
                alert('操作失败：' + (result.message || '未知错误'));
            }
        }

        // 添加评论
        async function addComment(postId) {
            const input = document.getElementById(`comment_${postId}`);
            const text = input.value.trim();
            if (!text) return;
            
            const profile = getProfile();
            const result = await addCommentToServer(postId, text, profile.name, profile.avatar);
            
            if (result.success) {
                input.value = '';
                await refreshPosts();
            } else {
                alert('评论失败：' + (result.message || '未知错误'));
            }
        }

        // 删除评论
        async function deleteComment(postId, commentId) {
            if (!confirm('确定删除这条评论吗？')) return;
            const result = await deleteCommentFromServer(postId, commentId);
            if (result.success) {
                await refreshPosts();
            } else {
                alert('删除失败：' + (result.message || '未知错误'));
            }
        }

        // 渲染帖子
        function renderPosts() {
            let posts = [...cachedPosts];
            const container = document.getElementById('postList');
            const profile = getProfile();

            // 过滤
            if (currentFilter !== '全部') {
                posts = posts.filter(p => p.category === currentFilter);
            }

            // 排序
            switch (currentSort) {
                case 'newest':
                    posts.sort((a, b) => new Date(b.time) - new Date(a.time));
                    break;
                case 'oldest':
                    posts.sort((a, b) => new Date(a.time) - new Date(b.time));
                    break;
                case 'mostLiked':
                    posts.sort((a, b) => b.likes - a.likes);
                    break;
                case 'mostCommented':
                    posts.sort((a, b) => b.comments.length - a.comments.length);
                    break;
            }

            if (posts.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="big-icon">📭</div>
                        <div>还没有反馈，快来发布第一条吧！</div>
                        <div class="sub">你的每一条建议都很重要 💡</div>
                    </div>
                `;
                return;
            }

            let html = '';
            for (const post of posts) {
                const isLiked = post.likedBy.includes(profile.name);
                html += `
                    <div class="post-item">
                        <div class="post-meta">
                            <div class="author">
                                <div class="avatar-sm">${post.avatar || '👤'}</div>
                                <span class="name">${post.author}</span>
                                <span class="tag">${post.category}</span>
                            </div>
                            <div class="time">${formatTime(post.time)}</div>
                        </div>
                        <div class="post-title">${post.title}</div>
                        <div class="post-content">${post.content.replace(/\n/g, '<br>')}</div>
                        <div class="post-stats">
                            <span onclick="toggleLike(${post.id})" class="${isLiked ? 'liked' : ''}">
                                ${isLiked ? '❤️' : '🤍'} ${post.likes}
                            </span>
                            <span>💬 ${post.comments.length}</span>
                            ${post.author === profile.name ? 
                                `<span onclick="deletePost(${post.id})" style="color:#fc8181;cursor:pointer;">🗑️ 删除</span>` : ''}
                        </div>
                        <div class="comment-section">
                            <div class="comment-input">
                                <input id="comment_${post.id}" placeholder="写评论..." maxlength="200">
                                <button onclick="addComment(${post.id})">发送</button>
                            </div>
                            ${post.comments.map(c => `
                                <div class="comment-item">
                                    <div class="avatar-xs">${c.avatar || '👤'}</div>
                                    <div class="comment-body">
                                        <div class="cname">${c.author}</div>
                                        <div class="ctext">${c.text}</div>
                                        <div class="ctime">${formatTime(c.time)}</div>
                                    </div>
                                    ${c.author === profile.name ? 
                                        `<div class="comment-actions" onclick="deleteComment(${post.id}, ${c.id})">🗑️</div>` : ''}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }
            container.innerHTML = html;
        }

        function formatTime(iso) {
            if (!iso) return '--';
            try {
                return new Date(iso).toLocaleString('zh-CN');
            } catch {
                return '--';
            }
        }

        function setSort(type) {
            currentSort = type;
            document.querySelectorAll('.sort-controls button').forEach(b => b.classList.remove('active'));
            const btn = document.querySelector(`.sort-controls button[onclick="setSort('${type}')"]`);
            if (btn) btn.classList.add('active');
            renderPosts();
        }

        function filterPosts(tag) {
            currentFilter = tag;
            document.querySelectorAll('#filterTags button').forEach(b => b.classList.remove('active'));
            const btn = document.querySelector(`#filterTags button[data-tag="${tag}"]`);
            if (btn) btn.classList.add('active');
            document.getElementById('filterLabel').textContent = `🏷️ ${tag}`;
            renderPosts();
        }

        // 点击模态框外部关闭
        document.getElementById('forumModal').addEventListener('click', function(e) {
            if (e.target === this) closeForum();
        });

        document.addEventListener('DOMContentLoaded', () => {
            checkAllServices();
            setInterval(checkAllServices, 30000);
        });
    </script>
</body>
</html>
